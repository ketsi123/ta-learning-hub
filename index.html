<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17152b"><title>TA Learning Hub — พัฒนาทักษะบุคลากร</title><style>html,body{margin:0;min-height:100%;background:#f7f8fc}#ta-boot{box-sizing:border-box;min-height:100vh;padding:32px;color:#263145;font-family:system-ui,Tahoma,sans-serif;background:radial-gradient(circle at 90% 0,#e9e4ff,transparent 40%),#f7f8fc}#ta-boot *{box-sizing:border-box}.ta-boot-brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}.ta-boot-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#7761ce;color:white;font-size:16px}.ta-boot-panel{max-width:820px;margin:8vh auto 0;background:white;border:1px solid #e9e8f2;border-radius:24px;padding:36px;box-shadow:0 14px 48px #38275d09}.ta-boot-eyebrow{color:#7963bf;font-size:11px;letter-spacing:2px;font-weight:700}.ta-boot-panel h1{font-size:clamp(22px,4vw,30px);margin:12px 0}.ta-boot-panel p{color:#6b7280;font-size:14px;line-height:1.8}.ta-boot-line{height:5px;margin:25px 0;background:#ece8f8;border-radius:9px;overflow:hidden}.ta-boot-line i{display:block;height:100%;width:35%;background:#8f78d3;border-radius:9px;animation:ta-loading 1.8s ease-in-out infinite}.ta-boot-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}.ta-boot-card{height:94px;border-radius:16px;background:#f7f6fb;border:1px solid #efedf5;padding:18px}.ta-boot-card:before,.ta-boot-card:after{content:'';display:block;background:#e8e5f1;border-radius:5px;height:9px;width:60%;margin-bottom:15px}.ta-boot-card:after{height:18px;width:35%}#ta-boot-retry{display:inline-block;background:#7354be;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer}#ta-boot-retry[hidden]{display:none}.ta-boot-foot{font-size:12px!important;color:#8a8da0!important}.ta-boot-error .ta-boot-line i{animation:none;background:#bc6481;width:100%}@keyframes ta-loading{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}@media(prefers-reduced-motion:reduce){.ta-boot-line i{animation:none;width:70%}}@media(max-width:560px){#ta-boot{padding:22px 16px}.ta-boot-panel{padding:24px;margin-top:7vh}.ta-boot-cards{gap:8px}.ta-boot-card{padding:12px;height:75px}}</style><script>(function(){
const pending=new Map(), waiters=[];let complete=false,failed=false;
const node=id=>document.getElementById(id);
function status(text){const n=node('ta-boot-status');if(n)n.textContent=text;}
function fail(text){if(complete)return;failed=true;status(text);const p=node('ta-boot');if(p){p.classList.add('ta-boot-error');p.setAttribute('aria-busy','false');}const b=node('ta-boot-retry');if(b)b.hidden=false;}
window.TA_BOOT={active:()=>!complete,status,fail,
styleStart:name=>pending.set(name,'loading'),styleEnd:(name,ok)=>{pending.set(name,ok?'ready':'error');for(const check of waiters)check();},
stylesReady:()=>new Promise((resolve,reject)=>{let timer;function check(){if([...pending.values()].includes('error')){clearTimeout(timer);reject(Error('โหลดรูปแบบหน้าเว็บไม่สำเร็จ กรุณาลองเปิดอีกครั้ง'));}else if(![...pending.values()].includes('loading')){clearTimeout(timer);resolve();}}waiters.push(check);timer=setTimeout(()=>reject(Error('โหลดหน้าเว็บใช้เวลานาน กรุณาตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง')),30000);check();}),
done:()=>{complete=true;clearTimeout(slowTimer);clearTimeout(failTimer);}
};
const slowTimer=setTimeout(()=>{if(!complete&&!failed)status('กำลังรอข้อมูลจาก Google Sheets ใช้เวลานานกว่าปกติ กรุณารอสักครู่…');},8000);
const failTimer=setTimeout(()=>{if(!complete)fail('ยังเปิดหน้าเว็บไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง');},45000);
window.addEventListener('error',e=>{if(complete)return;if(e.target&&e.target.tagName==='SCRIPT')fail('โหลดไฟล์หน้าเว็บไม่สำเร็จ กรุณาลองเปิดอีกครั้ง');else if(e.message)fail('เปิดหน้าเว็บไม่สำเร็จ กรุณาลองเปิดอีกครั้ง');},true);
window.addEventListener('offline',()=>{if(!complete)status('ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต กรุณาเชื่อมต่อแล้วลองอีกครั้ง');});
})();</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><script>TA_BOOT.styleStart('style.css')</script><link rel="stylesheet" href="style.css?v=20261028-faststart" media="print" onload="this.media='all';TA_BOOT.styleEnd('style.css',true)" onerror="TA_BOOT.styleEnd('style.css',false)"><script>TA_BOOT.styleStart('hub.css')</script><link rel="stylesheet" href="hub.css?v=20261028-faststart" media="print" onload="this.media='all';TA_BOOT.styleEnd('hub.css',true)" onerror="TA_BOOT.styleEnd('hub.css',false)"><script>TA_BOOT.styleStart('mindmap.css')</script><link rel="stylesheet" href="mindmap.css?v=20261028-faststart" media="print" onload="this.media='all';TA_BOOT.styleEnd('mindmap.css',true)" onerror="TA_BOOT.styleEnd('mindmap.css',false)"></head><body><div id="app"><section id="ta-boot" aria-busy="true"><div class="ta-boot-brand"><span class="ta-boot-mark">TA</span>Learning Hub</div><div class="ta-boot-panel"><span class="ta-boot-eyebrow">PEOPLE · SKILLS · GROWTH</span><h1>เตรียมพื้นที่การเรียนรู้ของคุณ</h1><p id="ta-boot-status" role="status" aria-live="polite">กำลังเปิดหน้าเว็บและเชื่อมต่อข้อมูลล่าสุด…</p><div class="ta-boot-line" aria-hidden="true"><i></i></div><div class="ta-boot-cards" aria-hidden="true"><div class="ta-boot-card"></div><div class="ta-boot-card"></div><div class="ta-boot-card"></div></div><p class="ta-boot-foot">จะแสดงรายชื่อและผลพัฒนาเมื่ออ่านข้อมูลสำเร็จ</p><button id="ta-boot-retry" type="button" onclick="location.reload()" hidden>ลองเปิดอีกครั้ง</button><noscript><p>กรุณาเปิด JavaScript เพื่อใช้งานระบบนี้</p></noscript></div></section></div><dialog id="detail"></dialog><input type="file" id="restore-upload" accept=".json" hidden><input type="file" id="upload" accept=".xlsx,.xls" hidden><script defer src="config.js?v=20261028-faststart"></script><script defer src="database.js?v=20261028-faststart"></script><script defer src="cloud.js?v=20261028-faststart"></script><script defer src="notifications.js?v=20261028-faststart"></script><script defer src="app.js?v=20261028-faststart"></script><script defer src="hub.js?v=20261028-faststart"></script><script defer src="tables.js?v=20261028-faststart"></script></body></html>
